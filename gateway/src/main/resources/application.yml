server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /$\{segment}
        
        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/user/**
          filters:
            - RewritePath=/api/user/(?<segment>.*), /$\{segment}
        
        - id: review-service
          uri: http://review-service:8083
          predicates:
            - Path=/api/review/**
          filters:
            - RewritePath=/api/review/(?<segment>.*), /$\{segment}
        
        - id: book-service
          uri: http://book-service:8084
          predicates:
            - Path=/api/book/**
          filters:
            - RewritePath=/api/book/(?<segment>.*), /$\{segment}
        
        - id: admin-service
          uri: http://admin-service:8085
          predicates:
            - Path=/api/admin/**
          filters:
            - RewritePath=/api/admin/(?<segment>.*), /$\{segment}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
