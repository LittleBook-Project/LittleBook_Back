<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Test Firebase Google & Microsoft → ID token</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 40px auto;
      }
      button {
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid #ccc;
        cursor: pointer;
        margin-right: 8px;
        margin-bottom: 8px;
      }
      pre {
        background: #f6f8fa;
        padding: 12px;
        border-radius: 8px;
        overflow: auto;
      }
      .ok {
        color: #0a8;
      }
      .err {
        color: #c33;
      }
    </style>
  </head>
  <body>
    <h1>Login Google / Microsoft → récupérer un ID token</h1>
    <ol>
      <li>Clique <b>Login Google</b> ou <b>Login Microsoft</b></li>
      <li>
        On affiche l’<code>idToken</code> (tronqué) puis on appelle
        <code>/api/auth/me</code>
      </li>
    </ol>

    <button id="google">Login Google</button>
    <button id="microsoft">Login Microsoft</button>

    <pre id="out">Prêt.</pre>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
      import {
        getAuth,
        GoogleAuthProvider,
        OAuthProvider,
        signInWithPopup,
      } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

      // ⚠️ Config exacte depuis Firebase Console
      const firebaseConfig = {
        apiKey: "AIzaSyBc6nTZhelJmNd3b7jEToAy9AIKdniEGQA",
        authDomain: "littlebook-b2d2d.firebaseapp.com",
        projectId: "littlebook-b2d2d",
        storageBucket: "littlebook-b2d2d.firebasestorage.app",
        messagingSenderId: "660565526137",
        appId: "1:660565526137:web:23d1fe03a27b7ad0baf6a8",
        measurementId: "G-C1Q00G057V",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const out = document.getElementById("out");

      // Fournisseurs d'identité
      const googleProvider = new GoogleAuthProvider();
      // Force l’écran de choix de compte Google
      googleProvider.setCustomParameters({ prompt: "select_account" });

      const microsoftProvider = new OAuthProvider("microsoft.com");
      // Force aussi le choix de compte côté Microsoft
      microsoftProvider.setCustomParameters({ prompt: "select_account" });
      // Exemple de scope Microsoft (optionnel) :
      // microsoftProvider.addScope("User.Read");

      async function loginWith(providerName, provider) {
        out.textContent = `Ouverture popup ${providerName}…`;
        try {
          const cred = await signInWithPopup(auth, provider);
          const idToken = await cred.user.getIdToken();

          out.textContent =
            `${providerName}: idToken: ` + idToken.slice(0, 60) + "…\n";
          console.log(`✅ ID Token Firebase (${providerName}):`, idToken);
          alert(`Ton ID token ${providerName} est dans la console navigateur !`);

          const resp = await fetch("http://localhost:8081/api/auth/me", {
            headers: { Authorization: `Bearer ${idToken}` },
          });
          const text = await resp.text();
          out.textContent +=
            (resp.ok ? "✅ " : "❌ ") +
            "/api/auth/me → " +
            resp.status +
            "\n" +
            text;
        } catch (e) {
          console.error(e);
          out.textContent = `${providerName} - Erreur: ` + e.message;
        }
      }

      document.getElementById("google").onclick = () =>
        loginWith("Google", googleProvider);

      document.getElementById("microsoft").onclick = () =>
        loginWith("Microsoft", microsoftProvider);
    </script>
  </body>
</html>
