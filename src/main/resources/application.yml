spring:
  application:
    name: littlebook-back

  main:
    banner-mode: console       # garde l’affichage de la bannière Spring Boot
    lazy-initialization: false # charge tout au démarrage (bon pour dev)

  output:
    ansi:
      enabled: always          # couleurs dans la console

  datasource:
    url: jdbc:postgresql://localhost:5432/littlebook 
    username: postgres
    password: postgres # le mot de passe est à changer
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none  # le schéma est défini dans schema.sql
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 8080                   # port du serveur
  error:
    include-message: always    # utile pour debug les erreurs


management:
  endpoints:
    web:
      exposure:
        include: health,info
