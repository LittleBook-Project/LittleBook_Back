version: '3.8'

# Réseau pour la communication inter-services
networks:
  littlebook-network:
    driver: bridge

services:
  # ========================================
  # 🔐 SERVICE D'AUTHENTIFICATION
  # ========================================
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: littlebook_auth
    ports:
      - "8081:8081"
    environment:
      - FIREBASE_CREDENTIALS=/app/littlebook.json
      - FIREBASE_PROJECT_ID=littlebook-b2d2d
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8081
    volumes:
      - ./littlebook.json:/app/littlebook.json:ro
    networks:
      - littlebook-network

    restart: unless-stopped

  # ========================================
  # 👤 SERVICE UTILISATEURS
  # ========================================
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: littlebook_user
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - littlebook-network
    restart: unless-stopped

  # ========================================
  # 📝 SERVICE REVIEWS
  # ========================================
  review-service:
    build:
      context: .
      dockerfile: review-service/Dockerfile
    container_name: littlebook_review
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - littlebook-network
    restart: unless-stopped

  # ========================================
  # 📚 SERVICE LIVRES
  # ========================================
  book-service:
    build:
      context: .
      dockerfile: book-service/Dockerfile
    container_name: littlebook_book
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - littlebook-network
    restart: unless-stopped

  # ========================================
  # ⚙️ SERVICE ADMINISTRATION
  # ========================================
  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    container_name: littlebook_admin
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - littlebook-network
    restart: unless-stopped

  # ========================================
  # 🌉 API GATEWAY (Routeur principal)
  # ========================================
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: littlebook_gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
    networks:
      - littlebook-network
    depends_on:
      - auth-service
      - user-service
      - review-service
      - book-service
      - admin-service
    restart: unless-stopped


