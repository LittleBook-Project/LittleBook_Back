server:
  port: 8084

spring:
  application:
    name: book-service

  main:
    banner-mode: console
    lazy-initialization: false

  datasource:
    url: jdbc:h2:mem:bookdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # Disable automatic execution of SQL scripts for local H2 dev to avoid running
  # PostgreSQL-specific scripts (e.g. CREATE EXTENSION) when using H2.
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Firebase config (use environment variables)
app:
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS:}
    project-id: ${FIREBASE_PROJECT_ID:}

# OpenLibrary API configuration
openlibrary:
  api:
    base-url: https://openlibrary.org/search.json
    timeout: 5000                          # milliseconds
    max-retries: 3
