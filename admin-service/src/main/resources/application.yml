server:
  port: 8085

spring:
  application:
    name: admin-service

  main:
    banner-mode: console
    lazy-initialization: false

  datasource:
    url: jdbc:h2:mem:admindb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true


  # Enable H2 console for local dev
  h2:
    console:
      enabled: true
      path: /h2-console
  # SQL initialization mode for embedded DB (data.sql will be executed)
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Firebase config (use environment variables)
app:
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS:}
    project-id: ${FIREBASE_PROJECT_ID:}

  # URL du service utilisateur (utilisé par admin pour enrichir les stats)
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8082}

# Swagger/OpenAPI UI path
springdoc:
  swagger-ui:
    path: /swagger-ui.html
