server:
  port: 8081

spring:
  application:
    name: admin-service

  main:
    banner-mode: console
    lazy-initialization: false

  datasource:
    url: jdbc:h2:mem:admindb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # Ensure Hibernate creates/updates schema before Spring runs data.sql
    defer-datasource-initialization: true


  # Enable H2 console for local dev
  h2:
    console:
      enabled: true
      path: /h2-console
  # SQL initialization mode for embedded DB (data.sql will be executed)
  sql:
    init:
      mode: embedded
  # Prevent execution of legacy/postgres schema.sql left in resources by clearing schema locations.
  # Keep data.sql as the source of truth for H2 embedded initialization.
  schema-locations: []
  data-locations: classpath:data.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Firebase config (use environment variables)
app:
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS:}
    project-id: ${FIREBASE_PROJECT_ID:}

# Swagger/OpenAPI UI path
springdoc:
  swagger-ui:
    path: /swagger-ui.html
