name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/littlebook
  JAVA_VERSION: '17'

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - auth-service
          - user-service
          - review-service
          - book-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build service with Maven (skip tests)
        run: |
          cd ${{ matrix.service }}
          mvn -q clean package -DskipTests

      - name: Run unit tests + generate JaCoCo report
        run: |
          cd ${{ matrix.service }}
          mvn -q test jacoco:report

      - name: Debug - list surefire reports
        if: always()
        run: |
          echo "== Surefire reports for ${{ matrix.service }} =="
          ls -la ${{ matrix.service }}/target/surefire-reports || true
          find ${{ matrix.service }}/target/surefire-reports -maxdepth 1 -type f -name "TEST-*.xml" -print || true

      - name: Generate test report
        if: always() && hashFiles(format('{0}/target/surefire-reports/TEST-*.xml', matrix.service)) != ''
        uses: dorny/test-reporter@v1
        with:
          name: Test Results - ${{ matrix.service }}
          path: '${{ matrix.service }}/target/surefire-reports/TEST-*.xml'
          reporter: 'java-junit'
          fail-on-error: false

      - name: Upload code coverage
        if: always() && hashFiles(format('{0}/target/site/jacoco/jacoco.xml', matrix.service)) != ''
        uses: codecov/codecov-action@v4
        with:
          files: ./${{ matrix.service }}/target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-${{ matrix.service }}
          fail_ci_if_error: false

  build-and-push:
    needs: quality-checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - auth-service
          - user-service
          - review-service
          - book-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable={{is_push}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Create image summary
        run: |
          echo "## Docker Image Built ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.meta.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - auth-service
          - user-service
          - review-service
          - book-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ matrix.service }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-${{ matrix.service }}'

  notify:
    needs: [quality-checks, build-and-push]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.quality-checks.result }}" != "success" ] || [ "${{ needs.build-and-push.result }}" != "success" ]; then
            echo "❌ Pipeline failed"
            exit 1
          else
            echo "✅ Pipeline succeeded"
          fi
