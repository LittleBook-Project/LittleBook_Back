name: Dependency Check

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**/pom.xml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '**/pom.xml'
  schedule:
    # Vérification quotidienne à 3h du matin
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    strategy:
      matrix:
        service:
          - admin-service
          - auth-service
          - user-service
          - review-service
          - book-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Check for vulnerable dependencies
        run: |
          cd ${{ matrix.service }}
          mvn org.owasp:dependency-check-maven:check || true
        continue-on-error: true

      - name: Upload dependency-check results
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: '${{ matrix.service }}/target/dependency-check-report.sarif'
          category: 'dependency-check-${{ matrix.service }}'
        continue-on-error: true

      - name: Run Maven dependency:tree
        run: |
          cd ${{ matrix.service }}
          echo "## Dependency Tree - ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          mvn dependency:tree -q >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
